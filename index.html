<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <meta
      name="description"
      content="This site is temporarily offline while something new is being built. Check back soon."
    >
    <title>Coming Soon | Abhay Pandey</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #e2e4e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        place-items: center;
        padding: 48px 24px;
        isolation: isolate;
      }

      .page::before,
      .page::after {
        position: absolute;
        z-index: -1;
        content: "";
        pointer-events: none;
      }

      .page::before {
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(0 122 204 / 14%), transparent 58%),
          linear-gradient(rgb(255 255 255 / 2.5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 2.5%) 1px, transparent 1px);
        background-size: auto, 56px 56px, 56px 56px;
        mask-image: radial-gradient(ellipse at center, #000, transparent 76%);
      }

      .page::after {
        top: 50%;
        left: 50%;
        width: min(80vw, 680px);
        aspect-ratio: 1;
        border: 1px solid rgb(255 255 255 / 4%);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .content {
        width: min(100%, 620px);
        text-align: center;
      }

      .monogram {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 48px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 16px;
        background: rgb(255 255 255 / 4%);
        box-shadow: 0 0 50px rgb(0 122 204 / 12%);
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.06em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        padding: 9px 14px;
        border: 1px solid rgb(252 211 77 / 16%);
        border-radius: 999px;
        background: rgb(252 211 77 / 6%);
        color: #f5d98b;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f5d36f;
        box-shadow: 0 0 12px rgb(245 211 111 / 70%);
        animation: pulse 2s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        color: #f8f9fb;
        font-size: clamp(42px, 8vw, 68px);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      p {
        max-width: 430px;
        margin: 24px auto 0;
        color: #a0a3ad;
        font-size: clamp(16px, 2.5vw, 18px);
        line-height: 1.75;
      }

      .signature {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 48px auto 0;
        padding-top: 20px;
        border-top: 1px solid rgb(255 255 255 / 8%);
        color: #777b86;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
      }

      .signature-mark {
        color: #168bd2;
      }

      .signature-divider {
        color: rgb(255 255 255 / 24%);
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
          box-shadow: 0 0 5px rgb(245 211 111 / 40%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="content" aria-labelledby="page-title">
        <div class="monogram" aria-hidden="true">AP</div>
        <div class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Temporarily offline
        </div>
        <h1 id="page-title">Something new<br>is on the way.</h1>
        <p>
          I&apos;m working behind the scenes to make this space better.
          The site will be back online soon.
        </p>
        <div class="signature" aria-label="Abhay Pandey, updating">
          <span class="signature-mark" aria-hidden="true">●</span>
          <span>ABHAY PANDEY</span>
          <span class="signature-divider" aria-hidden="true">/</span>
          <span>UPDATING</span>
        </div>
      </section>
    </main>
  </body>
</html>
